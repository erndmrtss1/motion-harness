<!doctype html>
<!--
  motion live — ayar paneli (OBS özel tarayıcı dock'u ya da ayrı sekme).
  Ayarlar localStorage'da kalır; sayfaya BroadcastChannel (aynı tarayıcı) ve yerel sunucu aktarıcısı (/__bus;
  `motion-render live` sunarken) ile gider. OBS kaynağı klavye odağı almadığı için tetik tuşları burada yakalanır.
-->
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>motion live · panel</title>
<style>
  :root { --bg: #1e1e1e; --fg: #e3e3e3; --mut: #9a9a9a; --line: #333; --card: #262626; --hi: #d0d0d0; --warn: #e0b060; --bad: #e07a6a; --ok: #8fc08f; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.4 system-ui, sans-serif; }
  main { padding: 12px 14px 40px; max-width: 520px; }
  h1 { font-size: 15px; margin: 0 0 8px; font-weight: 600; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--mut); margin: 18px 0 6px; font-weight: 600; }
  .status { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--mut); }
  .status b { color: var(--fg); font-weight: 600; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--bad); margin-right: 5px; vertical-align: 1px; }
  .dot.on { background: var(--ok); }
  canvas#meter { width: 100%; height: 64px; display: block; background: #151515; border: 1px solid var(--line); border-radius: 4px; margin-top: 8px; }
  .row { display: grid; grid-template-columns: 128px 1fr 74px; gap: 8px; align-items: center; margin: 3px 0; }
  .row label { color: var(--mut); }
  .row output { text-align: right; font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; }
  select, input[type=text], button { background: var(--card); color: var(--fg); border: 1px solid #444; border-radius: 4px; padding: 4px 8px; font: inherit; }
  button { cursor: pointer; }
  button:hover { border-color: #666; }
  button.flash { border-color: var(--hi); background: #3a3a3a; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .keys { display: grid; grid-template-columns: 52px 1fr; gap: 4px 8px; align-items: center; }
  .keys input { width: 52px; text-align: center; }
  .bar { display: flex; flex-wrap: wrap; gap: 6px; }
  .note { color: var(--mut); font-size: 12px; margin-top: 6px; }
  .warn { color: var(--warn); }
  .bad { color: var(--bad); }
</style>
</head>
<body>
<main>
  <h1>motion live · panel</h1>
  <div class="status">
    <span><span id="dot" class="dot"></span><b id="conn">sayfa bağlı değil</b></span>
    <span>durum <b id="mode">—</b></span>
    <span>fps <b id="fps">—</b></span>
    <span>giriş gecikmesi <b id="lat">—</b></span>
    <span>avatar <b id="av">—</b></span>
  </div>
  <canvas id="meter" width="960" height="128" aria-label="seviye ve zarf göstergesi"></canvas>
  <div id="err" class="note bad"></div>

  <h2>Tetikler</h2>
  <div id="triggers" class="grid"></div>
  <div class="note">Tuşlar bu panel odaktayken çalışır (OBS kaynağı klavye odağı almaz).</div>

  <h2>Kaynak</h2>
  <div class="row"><label for="source">ses kaynağı</label>
    <select id="source"><option value="mic">sayfa mikrofonu</option><option value="panel">bu panel (zarfı gönderir)</option><option value="kapali">kapalı</option></select><span></span></div>
  <div class="row"><label for="device">aygıt</label><select id="device"><option value="">varsayılan</option></select><span></span></div>
  <div id="groups"></div>

  <h2>Tuş eşlemesi</h2>
  <div id="keys" class="keys"></div>
  <div class="bar" style="margin-top:6px"><button id="addKey">+ tuş</button></div>

  <h2>Kayıt</h2>
  <div class="bar">
    <button id="rec">Zarfı kaydet</button>
    <label class="note" style="margin:0">oynat: <input id="playFile" type="file" accept="application/json"></label>
    <button id="stopPlay">Oynatmayı durdur</button>
  </div>

  <h2>Ayarlar</h2>
  <div class="bar">
    <button id="export">Dışa aktar (JSON)</button>
    <label class="note" style="margin:0">içe aktar: <input id="importFile" type="file" accept="application/json"></label>
    <button id="reset">Varsayılana dön</button>
  </div>
  <div class="note" id="relay"></div>
</main>
<script src="live.js" data-role="panel"></script>
<script src="panel.js"></script>
</body>
</html>
